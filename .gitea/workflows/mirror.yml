name: Mirror to GitHub

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # On a tag-triggered run actions/checkout leaves the workspace on a
      # detached HEAD at the tag, so no local refs/heads/master exists. Fetch
      # the branches into remote-tracking refs, which are present in both the
      # branch and tag contexts, and push from those instead.
      - name: Fetch all branches and tags
        run: git fetch --prune --tags --force origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Push master + tags to GitHub mirror
        run: |
          git push --force "https://x-access-token:${WHITTAKER_TECH_GITHUB_KEY}@github.com/whittakertech/poly.git" \
            "refs/remotes/origin/master:refs/heads/master" \
            "refs/tags/*:refs/tags/*"
        env:
          WHITTAKER_TECH_GITHUB_KEY: ${{ secrets.WHITTAKER_TECH_GITHUB_KEY }}