name: CI

on:
  push:
    branches: [master, 'epic/**']
  pull_request:
    branches: [master, 'epic/**']

jobs:
  # SQLite lane: full Ruby x ActiveRecord cross-product. Cheap (in-memory,
  # no external service), so we exercise every declared combination.
  test-sqlite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        activerecord: ['6.1', '7.1', '7.2', '8.x']
        exclude:
          # Rails 6.1 exists for hellodancerrails (Rails 6.1.7.10 / Ruby
          # 3.3.11), the consumer this floor was lowered for. Exercise exactly
          # that pairing: 6.1 predates Ruby 3.4 entirely, and 3.2 is untested
          # by any real consumer.
          - { ruby: '3.2', activerecord: '6.1' }
          - { ruby: '3.4', activerecord: '6.1' }

    env:
      POLY_TEST_ADAPTER: sqlite3
      ACTIVERECORD_VERSION: ${{ matrix.activerecord }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Run linter
        run: bundle exec rubocop

  # PostgreSQL lane: a real PG service container. This workflow runs on
  # real GitHub-hosted runners (mirrored from Gitea via mirror.yml), NOT
  # Aerie's self-hosted act_runner -- see .gitea/workflows/ci.yml for the
  # Hatchery-backed equivalent used there. A real GH-hosted runner executes
  # the job directly on the VM (no job-level `container:`), so service
  # containers are reachable via `localhost` with a published port, not via
  # the service name as a Docker network alias -- that alias-reachable
  # behavior only applies when the job itself runs inside a container,
  # which is true for Gitea's act_runner but not here. Each matrix leg gets
  # its own isolated ephemeral runner VM on real GitHub Actions, so a fixed
  # published port does not collide across the matrix the way it would on
  # a single shared self-hosted runner host.
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4']
        activerecord: ['7.1', '7.2', '8.x']
        include:
          # Rails 6.1 needs a Ruby it supports; this lane's 3.4 is too new.
          # Mirrors hellodancerrails, the PostgreSQL consumer this floor
          # exists for.
          - { ruby: '3.3', activerecord: '6.1' }

    env:
      POLY_TEST_ADAPTER: postgresql
      POLY_TEST_DB_HOST: localhost
      POLY_TEST_DB_PORT: 5432
      POLY_TEST_DB_USER: postgres
      POLY_TEST_DB_PASSWORD: postgres
      POLY_TEST_DB_NAME: poly_test
      ACTIVERECORD_VERSION: ${{ matrix.activerecord }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec
